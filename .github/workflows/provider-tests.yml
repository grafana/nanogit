name: Provider Tests

# Provider tests exercise nanogit against real hosted Git providers
# (GitHub, GitLab, Bitbucket) and require credentials pulled from Vault.
# Because the tests run repository code with those secrets in scope, they must
# NEVER execute untrusted code from forks — a malicious change could otherwise
# exfiltrate the tokens and signing keys. This workflow therefore only runs in
# the trusted base-repo context:
#
#   - workflow_run: after the "CI" workflow completes, and ONLY when the
#     triggering run came from a branch in grafana/nanogit itself (not a fork).
#   - workflow_dispatch: manually, by a maintainer, against a reviewed ref.
#   - schedule: nightly, on the default branch.
#
# Fork pull requests get full coverage from the secret-free jobs in ci.yml
# (unit tests, lint, and the Gitea-based integration tests); provider
# compatibility is validated here, in a trusted context, before/after merge.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

# No permissions by default; each job requests only what it needs.
permissions: {}

jobs:
  provider-tests:
    name: ${{ matrix.name }} Provider Tests
    # Only run in a trusted context. For workflow_run, require that CI passed
    # and that the triggering head repository is grafana/nanogit itself, i.e.
    # not a fork. workflow_dispatch and schedule are maintainer-/repo-initiated
    # and therefore always trusted.
    if: >-
      github.repository == 'grafana/nanogit' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    container:
      image: golang:1.26.5-alpine@sha256:0178a641fbb4858c5f1b48e34bdaabe0350a330a1b1149aabd498d0699ff5fb2
    # These permissions are needed to assume roles from GitHub's OIDC for Vault.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GitHub
            provider: github
            vault: github
            repo_var: GH_REPO_NAME
          - name: GitLab
            provider: gitlab
            vault: gitlab
            repo_var: GITLAB_REPO_NAME
          - name: Bitbucket
            provider: bitbucket
            vault: bitbucket
            repo_var: BITBUCKET_REPO_NAME
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Check out the exact commit that triggered CI (workflow_run) or the
          # selected ref (dispatch/schedule). Safe because this workflow only
          # runs for non-fork revisions.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Install build dependencies
        run: |
          apk add --no-cache git make gcc musl-dev bash curl gpg
      - id: get-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@e46fe1e9a2bf9e618bcf8d8d32f3a7381b45c06d # get-vault-secrets/v2.0.0
        with:
          # Secrets placed in the ci/repo/grafana/<repo>/<path> path in Vault
          repo_secrets: |
            REPO_USER=${{ matrix.vault }}:REPO_USER
            REPO_TOKEN=${{ matrix.vault }}:REPO_TOKEN
            SIGN_EMAIL=signing:EMAIL
            SIGN_GPG_KEY=signing:GPG_KEY
            SIGN_SSH_KEY=signing:SSH_KEY
            SIGN_SMIME_KEY=signing:SMIME_KEY
            SIGN_SMIME_CERT=signing:SMIME_CERT
      - name: Cache Go modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Sync vendor directory
        run: go work vendor
      - name: Run provider tests
        env:
          CGO_ENABLED: 1
          TEST_PROVIDER: ${{ matrix.provider }}
          TEST_REPO: ${{ vars[matrix.repo_var] }}
          TEST_USER: ${{ fromJSON(steps.get-secrets.outputs.secrets).REPO_USER }}
          TEST_TOKEN: ${{ fromJSON(steps.get-secrets.outputs.secrets).REPO_TOKEN }}
          TEST_SIGN_EMAIL: ${{ fromJSON(steps.get-secrets.outputs.secrets).SIGN_EMAIL }}
          TEST_GPG_KEY: ${{ fromJSON(steps.get-secrets.outputs.secrets).SIGN_GPG_KEY }}
          TEST_SSH_KEY: ${{ fromJSON(steps.get-secrets.outputs.secrets).SIGN_SSH_KEY }}
          TEST_SMIME_KEY: ${{ fromJSON(steps.get-secrets.outputs.secrets).SIGN_SMIME_KEY }}
          TEST_SMIME_CERT: ${{ fromJSON(steps.get-secrets.outputs.secrets).SIGN_SMIME_CERT }}
        run: |
          if [ -z "$TEST_REPO" ] || [ -z "$TEST_TOKEN" ] || [ -z "$TEST_USER" ]; then
            echo "Skipping provider tests: TEST_REPO or TEST_TOKEN or TEST_USER not set"
            exit 0
          fi
          make test-providers

  # workflow_run runs do not attach their result to the originating commit
  # automatically. Publish a commit status so same-repo PRs still surface a
  # pass/fail check for the provider tests. Skipped for fork-triggered runs
  # (where provider-tests is skipped) and for dispatch/schedule runs.
  report:
    name: Report status
    needs: provider-tests
    if: always() && github.event_name == 'workflow_run' && needs.provider-tests.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ needs.provider-tests.result == 'success' && 'success' || 'failure' }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sSL --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"Provider Tests\",\"description\":\"Provider tests ${STATE}\",\"target_url\":\"${RUN_URL}\"}"
