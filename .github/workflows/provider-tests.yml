name: Provider Tests

# Provider tests exercise nanogit against real hosted Git providers
# (GitHub, GitLab, Bitbucket) and require credentials pulled from Vault.
# Because the tests run repository code with those secrets in scope, they must
# NEVER execute untrusted code from forks — a malicious change could otherwise
# exfiltrate the tokens and signing keys.
#
# GitHub only exposes secrets and an OIDC token to workflows running in the
# trusted base-repo context: pushes, same-repo pull requests, schedules and
# manual dispatches. Fork pull requests get a read-only token and no OIDC, so
# the guard below skips them entirely. (We deliberately avoid the workflow_run
# trigger: it runs in a privileged context and is easy to misuse — flagged by
# zizmor as a dangerous trigger — and buys us nothing here, since same-repo
# PRs already run with the credentials these tests need.)
#
# Fork pull requests still get full coverage from the secret-free jobs in
# ci.yml (unit tests, lint, and the Gitea-based integration tests).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: >-
          PR number to test (use for fork PRs, after reviewing the diff).
          Leave blank to test the branch selected above.
        required: false
        default: ""
      head_sha:
        description: >-
          Optional. The PR head commit SHA you reviewed. When set (the slash
          command always sets it), the run aborts if the PR head has moved
          since, so it never executes code you did not vouch for.
        required: false
        default: ""
  schedule:
    - cron: "0 3 * * *"

concurrency:
  # Provider tests mutate shared remote test repositories (create/delete
  # branches, push commits), so overlapping runs on the same ref would race.
  # PRs share one group per branch so a superseded push cancels the older run;
  # main uses a per-SHA group (never cancels between commits), mirroring ci.yml.
  group: ${{ github.ref == 'refs/heads/main' && format('{0}-main-{1}', github.workflow, github.sha) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No permissions by default; each job requests only what it needs.
permissions: {}

jobs:
  provider-tests:
    name: ${{ matrix.name }} Provider Tests
    # Only run in a trusted context: this repository, and never a fork PR
    # (a fork's head repository differs from the base repository).
    if: >-
      github.repository == 'grafana/nanogit' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    container:
      image: golang:1.26.6-alpine@sha256:3889b425f035be855a72fb4755265311293b6d414521f0a519d819df32222d83
    # These permissions are needed to assume roles from GitHub's OIDC for Vault.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GitHub
            provider: github
            vault: github
            repo_var: GH_REPO_NAME
          - name: GitLab
            provider: gitlab
            vault: gitlab
            repo_var: GITLAB_REPO_NAME
          - name: Bitbucket
            provider: bitbucket
            vault: bitbucket
            repo_var: BITBUCKET_REPO_NAME
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # For a manual run targeting a PR (typically a fork PR that the
          # automatic guard skips), check out that PR's merge ref. A maintainer
          # with write access must trigger this and is responsible for having
          # reviewed the diff — the tests run the contributor's code with real
          # provider credentials. For all other events, use the default ref.
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.pr != '') && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - name: Install build dependencies
        run: |
          apk add --no-cache git make gcc musl-dev bash curl gpg
      - name: Verify PR head matches the reviewed commit
        # Closes the review-to-run TOCTOU: refs/pull/<n>/merge is recomputed by
        # GitHub whenever the PR changes, so without this a contributor could
        # push new code after the maintainer triggered the run and have it
        # execute with the provider credentials in scope. We compare the PR's
        # *current* head (refs/pull/<n>/head, read straight from the remote — no
        # dependency on how checkout fetched the tree) against the SHA the
        # maintainer vouched for at dispatch. If it moved, refuse to run, and do
        # so before any secrets are fetched below.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr != '' && inputs.head_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr }}
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: |
          current_head=$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "refs/pull/${PR_NUMBER}/head" | cut -f1)
          if [ -z "$current_head" ]; then
            echo "::error::Could not resolve refs/pull/${PR_NUMBER}/head."
            exit 1
          fi
          if [ "$current_head" != "$EXPECTED_SHA" ]; then
            echo "::error::PR head moved since dispatch (reviewed ${EXPECTED_SHA}, now ${current_head}). Re-review the new commits and trigger again."
            exit 1
          fi
          echo "PR head matches the reviewed commit ${EXPECTED_SHA}."
      - id: get-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@2e3743a1f8abfd3e921e53a7726ec0744c11bb01 # get-vault-secrets/v2.0.1
        with:
          # Secrets placed in the ci/repo/grafana/<repo>/<path> path in Vault
          repo_secrets: |
            REPO_USER=${{ matrix.vault }}:REPO_USER
            REPO_TOKEN=${{ matrix.vault }}:REPO_TOKEN
            SIGN_EMAIL=signing:EMAIL
            SIGN_GPG_KEY=signing:GPG_KEY
            SIGN_SSH_KEY=signing:SSH_KEY
            SIGN_SMIME_KEY=signing:SMIME_KEY
            SIGN_SMIME_CERT=signing:SMIME_CERT
      - name: Cache Go modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Sync vendor directory
        run: go work vendor
      - name: Run provider tests
        env:
          CGO_ENABLED: 1
          TEST_PROVIDER: ${{ matrix.provider }}
          TEST_REPO: ${{ vars[matrix.repo_var] }}
          TEST_USER: ${{ fromJSON(steps.get-secrets.outputs.secrets).REPO_USER }}
          TEST_TOKEN: ${{ fromJSON(steps.get-secrets.outputs.secrets).REPO_TOKEN }}
          TEST_SIGN_EMAIL: ${{ fromJSON(steps.get-secrets.outputs.secrets).SIGN_EMAIL }}
          TEST_GPG_KEY: ${{ fromJSON(steps.get-secrets.outputs.secrets).SIGN_GPG_KEY }}
          TEST_SSH_KEY: ${{ fromJSON(steps.get-secrets.outputs.secrets).SIGN_SSH_KEY }}
          TEST_SMIME_KEY: ${{ fromJSON(steps.get-secrets.outputs.secrets).SIGN_SMIME_KEY }}
          TEST_SMIME_CERT: ${{ fromJSON(steps.get-secrets.outputs.secrets).SIGN_SMIME_CERT }}
        run: |
          if [ -z "$TEST_REPO" ] || [ -z "$TEST_TOKEN" ] || [ -z "$TEST_USER" ]; then
            echo "Skipping provider tests: TEST_REPO or TEST_TOKEN or TEST_USER not set"
            exit 0
          fi
          make test-providers
