name: Provider Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number for a reviewed GitHub-only run (leave blank for the normal suite)
        type: string
      reviewed_sha:
        description: Full reviewed PR head SHA (required with pr)
        type: string
  schedule:
    - cron: "0 3 * * *"

concurrency:
  # Provider tests mutate shared remote test repositories (create/delete
  # branches, push commits), so overlapping runs on the same ref would race.
  # PRs share one group per branch so a superseded push cancels the older run;
  # main uses a per-SHA group (never cancels between commits), mirroring ci.yml.
  group: ${{ github.ref == 'refs/heads/main' && format('{0}-main-{1}', github.workflow, github.sha) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No permissions by default; each job requests only what it needs.
permissions: {}

jobs:
  reviewed-pr:
    if: >-
      github.repository == 'grafana/nanogit' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && (inputs.pr != '' || inputs.reviewed_sha != '')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      id-token: write
    steps:
      - name: Verify reviewed PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.reviewed_sha }}
        run: |
          [[ "$PR" =~ ^[1-9][0-9]*$ && "$SHA" =~ ^[0-9a-f]{40}$ ]]
          head=$(gh api "repos/grafana/nanogit/pulls/$PR" --jq 'select(.state == "open" and .base.ref == "main") | .head.sha')
          [[ "$SHA" == "$head" ]]
      - id: github-token
        uses: grafana/shared-workflows/actions/create-github-app-token@580590a644e82e79bb2598bdaba0be245a14dda0
        with:
          github_app: grafana-nanogit-ci
          permission_set: workflow_dispatch
      - name: Run reviewed GitHub provider tests
        env:
          TEST_TOKEN: ${{ steps.github-token.outputs.token }}
          SHA: ${{ inputs.reviewed_sha }}
        run: |
          : "${TEST_TOKEN:?GitHub App token is required}"
          docker run --rm -e SHA -e TEST_TOKEN -e TEST_USER=x-access-token -e TEST_PROVIDER=github \
            -e TEST_REPO=https://github.com/grafana-experimental/nanogit-test.git -e CGO_ENABLED=1 -w /src \
            golang:1.27.3-alpine@sha256:fa3d596898d9f126af7c01d14ee7597bab3f39cccf392ef36b69fe77cd681f18 \
            sh -eu -c '
              apk add --no-cache git make gcc musl-dev bash curl gpg
              curl -fsSL "https://codeload.github.com/grafana/nanogit/tar.gz/$SHA" -o /tmp/source.tgz
              tar -xzf /tmp/source.tgz --strip-components=1
              go work vendor
              make test-providers
            '

  provider-tests:
    name: ${{ matrix.name }} Provider Tests
    # Only run in a trusted context: this repository, and never a fork PR
    # (a fork's head repository differs from the base repository).
    if: >-
      github.repository == 'grafana/nanogit' &&
      inputs.pr == '' && inputs.reviewed_sha == '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    container:
      image: golang:1.27.3-alpine@sha256:fa3d596898d9f126af7c01d14ee7597bab3f39cccf392ef36b69fe77cd681f18
    # These permissions are needed to assume roles from GitHub's OIDC for Vault.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GitHub
            provider: github
            repo: https://github.com/grafana-experimental/nanogit-test.git
          - name: GitLab
            provider: gitlab
            vault: gitlab
            repo_var: GITLAB_REPO_NAME
          - name: Bitbucket
            provider: bitbucket
            vault: bitbucket
            repo_var: BITBUCKET_REPO_NAME
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install build dependencies
        run: |
          apk add --no-cache git make gcc musl-dev bash curl gpg
      - id: provider-secrets
        if: matrix.provider != 'github'
        uses: grafana/shared-workflows/actions/get-vault-secrets@2f1ddaf3ce1aa677356243d0dd584be33cfa35e3
        with:
          repo_secrets: |
            REPO_USER=${{ matrix.vault }}:REPO_USER
            REPO_TOKEN=${{ matrix.vault }}:REPO_TOKEN
      - id: get-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@2f1ddaf3ce1aa677356243d0dd584be33cfa35e3 # get-vault-secrets/v2.1
        with:
          repo_secrets: |
            SIGN_EMAIL=signing:EMAIL
            SIGN_GPG_KEY=signing:GPG_KEY
            SIGN_SSH_KEY=signing:SSH_KEY
            SIGN_SMIME_KEY=signing:SMIME_KEY
            SIGN_SMIME_CERT=signing:SMIME_CERT
      - name: Cache Go modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Sync vendor directory
        run: go work vendor
      - id: github-token
        if: matrix.provider == 'github'
        uses: grafana/shared-workflows/actions/create-github-app-token@580590a644e82e79bb2598bdaba0be245a14dda0
        with:
          github_app: grafana-nanogit-ci
          permission_set: ${{ github.event_name }}
      - name: Run provider tests
        env:
          CGO_ENABLED: 1
          TEST_PROVIDER: ${{ matrix.provider }}
          TEST_REPO: ${{ matrix.repo || vars[matrix.repo_var] }}
          TEST_USER: ${{ matrix.provider == 'github' && 'x-access-token' || fromJSON(steps.provider-secrets.outputs.secrets).REPO_USER }}
          TEST_TOKEN: ${{ steps.github-token.outputs.token || fromJSON(steps.provider-secrets.outputs.secrets || '{}').REPO_TOKEN }}
          TEST_SIGN_EMAIL: ${{ fromJSON(steps.get-secrets.outputs.secrets).SIGN_EMAIL }}
          TEST_GPG_KEY: ${{ fromJSON(steps.get-secrets.outputs.secrets).SIGN_GPG_KEY }}
          TEST_SSH_KEY: ${{ fromJSON(steps.get-secrets.outputs.secrets).SIGN_SSH_KEY }}
          TEST_SMIME_KEY: ${{ fromJSON(steps.get-secrets.outputs.secrets).SIGN_SMIME_KEY }}
          TEST_SMIME_CERT: ${{ fromJSON(steps.get-secrets.outputs.secrets).SIGN_SMIME_CERT }}
        run: |
          if [ "$TEST_PROVIDER" = github ]; then
            : "${TEST_TOKEN:?GitHub App token is required}"
          fi
          if [ -z "$TEST_REPO" ] || [ -z "$TEST_TOKEN" ] || [ -z "$TEST_USER" ]; then
            echo "Skipping provider tests: TEST_REPO or TEST_TOKEN or TEST_USER not set"
            exit 0
          fi
          make test-providers
